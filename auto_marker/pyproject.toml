[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "auto-marker"
version = "0.1.0"
description = "半自动批改台 — 基于 PP-OCRv6 的试卷手写识别与批改系统"
requires-python = ">=3.12"
dependencies = [
    "pyftpdlib>=2.0",
    "watchdog>=4.0",
    "pdfplumber>=0.11",
    "PyMuPDF>=1.23",
    "reportlab>=4.0",
    "PyPDF2>=3.0",
    "paddlepaddle>=3.3.0",
    "paddleocr>=3.7.0,<4.0",
    "opencv-python>=4.8",
    "sqlalchemy>=2.0",
    "streamlit>=1.35",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # 行长度由 line-length 控制，不强制报错

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
