[ftp]
host = 0.0.0.0
port = 2121
dir = ./data/incoming
anon = yes

[monitor]
incoming_dir = ./data/incoming
working_dir = ./data/working
output_dir = ./data/output
backup_dir = ./data/backup
max_workers = 4
file_stable_timeout = 15

[ocr]
model = ch_PP-OCRv4_mobile
use_gpu = no
confidence_threshold = 0.6

[grader]
green_threshold = 0.85
orange_threshold = 0.60

[printer]
# 打印机名称，空则用系统默认打印机
name =
# 留空用系统默认
pdf_viewer =

[web]
host = 0.0.0.0
port = 8501

[log]
level = INFO
dir = ./data/logs
