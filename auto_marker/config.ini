[ftp]
host = 0.0.0.0
port = 2121
dir = ./data/incoming
anon = no

[monitor]
incoming_dir = ./data/incoming
working_dir = ./data/working
output_dir = ./data/output
backup_dir = ./data/backup
max_workers = 4
file_stable_timeout = 15

[ocr]
model = ch_PP-OCRv4_mobile
use_gpu = no
confidence_threshold = 0.6
dpi = 200

[grader]
green_threshold = 0.85
orange_threshold = 0.60
skip_threshold = 0.30

[layout]
handwritten_height_min = 90
pinyin_height_max = 55
column_gap_threshold = 150
y_proximity_threshold = 30
sub_region_height_min = 130
sub_region_ratio = 0.55

[image]
blur_threshold = 60
low_res_threshold = 1000

[printer]
# 打印机名称，空则用系统默认打印机
name =
# 留空用系统默认
pdf_viewer =

[web]
host = 0.0.0.0
port = 8501
# 设置密码后 Web 界面需登录（留空则无需密码）
password =

[log]
level = INFO
dir = ./data/logs
# 设为 yes 启用 JSON 结构化日志（文件日志），便于机器解析
json = no
